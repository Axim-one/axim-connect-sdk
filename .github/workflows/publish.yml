name: publish

# npm 배포 워크플로우. 수동 실행(workflow_dispatch) 또는 GitHub Release 발행 시 동작.
# 사전: repo Secret `NPM_TOKEN` = npm Granular token (Packages: Read+Write, bypass 2FA).
# 버전은 각 package.json 에서 관리. 이미 게시된 버전은 자동 skip 하므로,
# Release 이벤트로 재실행돼도 실패하지 않는다(중복 게시 방지). 새 릴리스 전 bump 필요.

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build --workspaces --if-present
      # 의존 순서: connect 먼저, 그다음 connect-alphasec.
      # 이미 게시된 버전이면 skip (npm 이 중복 게시를 거부하므로).
      - name: Publish @axim-one/connect
        run: |
          V=$(node -p "require('./packages/connect/package.json').version")
          if npm view "@axim-one/connect@$V" version > /dev/null 2>&1; then
            echo "@axim-one/connect@$V already published — skipping."
          else
            npm publish -w @axim-one/connect --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @axim-one/connect-alphasec
        run: |
          V=$(node -p "require('./packages/connect-alphasec/package.json').version")
          if npm view "@axim-one/connect-alphasec@$V" version > /dev/null 2>&1; then
            echo "@axim-one/connect-alphasec@$V already published — skipping."
          else
            npm publish -w @axim-one/connect-alphasec --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
